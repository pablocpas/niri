name: Nix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - flake.lock
      - flake.nix
      - Cargo.lock
      - Cargo.toml
      - src/**
      - tiri-config/**
      - tiri-ipc/**
      - resources/**
  push:
    branches:
      - main
    paths:
      - flake.lock
      - flake.nix
      - Cargo.lock
      - Cargo.toml
      - src/**
      - tiri-config/**
      - tiri-ipc/**
      - resources/**

jobs:
  flake-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - uses: cachix/install-nix-action@v31

      - name: Check flake
        run: nix flake check --print-build-logs
